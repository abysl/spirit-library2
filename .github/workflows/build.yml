name: Build artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            installer: deb
          - os: macos-15
            target: macos-arm64
            installer: dmg
          - os: windows-2025
            target: windows-x64
            installer: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: rust
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Check Rust
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-features --locked
      - name: Build native library, bindings, and CLI
        working-directory: kmp
        run: ./gradlew prepareNative -ParchiveTarget='${{ matrix.target }}' --console=plain --max-workers=2
      - name: Test mesh, JVM SDK, and app
        working-directory: kmp
        run: ./gradlew :mesh:jvmTest :sdk:jvmTest :demo:shared:jvmTest --console=plain --max-workers=2
      - name: Package desktop app
        working-directory: kmp
        run: ./gradlew :demo:desktopApp:packageDistributionForCurrentOS --console=plain --max-workers=2
      - name: Upload desktop installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-desktop-${{ matrix.target }}
          path: kmp/demo/desktopApp/build/compose/binaries/main/${{ matrix.installer }}/*.${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-cli-${{ matrix.target }}
          path: dist/spirit-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload desktop failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-desktop-logs-${{ matrix.target }}
          path: |
            kmp/demo/desktopApp/build/compose/logs/
            kmp/demo/desktopApp/build/compose/tmp/*.args.txt
            kmp/mesh/build/test-results/
            kmp/sdk/build/test-results/
            kmp/demo/shared/build/test-results/
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.3.11579264'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: rust
          cache-on-failure: true
          key: android
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build host library and generate bindings
        working-directory: kmp
        run: ./gradlew prepareNative --console=plain --max-workers=2
      - name: Build Android native libraries
        working-directory: rust
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o ../kmp/sdk/src/androidMain/jniLibs build --release --locked -p spirit-ffi
      - name: Build installable APK
        working-directory: kmp
        run: ./gradlew :demo:androidApp:assembleDebug --console=plain --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-android-apk
          path: kmp/demo/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  web:
    name: Web (JavaScript and WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Compile mesh tests and build web distributions
        working-directory: kmp
        run: ./gradlew :mesh:compileTestKotlinJs :mesh:compileTestKotlinWasmJs :demo:webApp:jsBrowserDistribution :demo:webApp:wasmJsBrowserDistribution --console=plain --max-workers=2
      - name: Upload JavaScript web app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-web-js
          path: kmp/demo/webApp/build/dist/js/productionExecutable/
          if-no-files-found: error
          retention-days: 30
      - name: Upload WebAssembly web app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spirit2-web-wasm
          path: kmp/demo/webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 30
